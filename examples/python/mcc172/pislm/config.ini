; =====================================================================
;  PiSLM configuration (MCC 172 + optional DT9837A)
; =====================================================================
;  Edit this file on the Raspberry Pi, then restart the service:
;      sudo systemctl restart pislm
; ---------------------------------------------------------------------

[devices]
; Acquisition devices to open, in order. Global channel numbers are assigned
; sequentially: with both enabled, mcc172 = global 0-1, dt9837a = global 2-5
; (6 channels total). A listed device that is not attached is skipped with a
; log message, so this config works with either or both connected.
;
;   mcc172  - MCC 172 DAQ HAT, 2 IEPE channels (daqhats library)
;   dt9837a - Data Translation DT9837A USB, 4 IEPE channels (uldaq library)
;
; NOTE: the two devices run separate ADC clocks (no hardware sync). Levels
; and metrics per channel are unaffected; cross-channel phase analysis is
; only valid within a single device.
enabled = mcc172, dt9837a

[mcc172]
; Local channels to scan on the MCC 172 (subset of 0, 1).
channels = 0, 1
; IEPE constant-current (2 mA) supply on/off for this device's channels.
iepe_enable = true
; Sensor sensitivity in mV per mechanical unit, per LOCAL channel.
;   * 1000 = no scaling -> data in volts (V).
;   * A microphone rated 50 mV/Pa -> 50 -> data in pascals (Pa), and SPL
;     levels/metrics use the 20 uPa reference automatically.
sensitivity_ch0 = 1000
sensitivity_ch1 = 1000

[dt9837a]
; Local channels on the DT9837A -- must be contiguous from 0 (uldaq scans a
; low..high range), e.g. "0, 1, 2, 3" for all four.
channels = 0, 1, 2, 3
; IEPE excitation on/off (AC coupling is always used for these channels).
iepe_enable = true
; Sensitivity in mV/unit per LOCAL channel (converted to the uldaq V/unit
; internally). Same convention as the mcc172 section.
sensitivity_ch0 = 1000
sensitivity_ch1 = 1000
sensitivity_ch2 = 1000
sensitivity_ch3 = 1000

[acquisition]
; Requested samples per second per channel, applied to every device. Each
; device rounds to its own nearest achievable rate (MCC 172: 51200/N; the
; DT9837A returns its actual rate when the scan starts) -- check the
; handshake/"get_clock" for the per-device actual rates.
sample_rate = 51200

; Send the full-rate raw waveform on the stream port. Off by default: this
; behaves like a sound level meter (streams Fast time-weighted levels and
; keeps raw buffered for on-demand metrics). Turn on only if you want the
; full waveform streamed live as well.
stream_raw = false

[network]
; Interface to bind the TCP servers to. 0.0.0.0 listens on all interfaces
; (Wi-Fi, USB-ethernet, etc.). The laptop connects to the Pi's IP address.
host = 0.0.0.0

; Two separate ports:
;   control_port - newline-delimited JSON commands/responses (both ways)
;   stream_port  - raw waveform frames (Pi -> laptop)
control_port = 5000
stream_port = 5001

; Per-client send buffer, in blocks. If a laptop cannot keep up, the
; oldest queued blocks are dropped (so a slow client never stalls the ADC).
max_queue_blocks = 64

[control]
; Begin streaming automatically at boot (original headless behavior). The
; laptop can always stop/reconfigure/restart afterwards over the control
; channel. Set to false to boot idle and start only on command.
autostart = true

[dsp]
; Number of worker PROCESSES for the level/band DSP.
;   -1 -> auto: cpu_count() - 1 (3 on a Pi 4), leaving a core for the
;         acquisition loop, networking, and the OS
;    0 -> inline: do the DSP in the acquisition thread (the old behavior)
;    N -> at most N workers
;
; Threads cannot be used here: scipy.signal.sosfilt holds the GIL, so a
; thread pool measures SLOWER than serial. Worker processes each own the
; filter state for their channels and receive blocks through shared memory
; (no pickling of sample data).
;
; Measured on a Pi 4, 6 ch at 51.2 kHz with 1/3-octave bands to 20 kHz:
; one core at ~91% (inline) drops to ~41% spread over 3 cores.
;
; A worker serves exactly one device (blocks arrive per device), so the
; effective minimum is one worker per device with channels.
workers = -1

[resample]
; Convert every device's stream onto ONE common sample rate, correcting the
; drift between their independent ADC clocks.
;
; Why: the MCC 172 and the DT9837A have separate crystals (each +-50 ppm),
; so they slip up to ~100 us per second -- 36 degrees of phase at 1 kHz
; after one second. The GPIO trigger aligns the scans' START; this keeps
; them aligned afterwards. Without it, cross-device phase/correlation is
; only valid for a moment after the trigger.
;
; How: each device's TRUE rate is measured against the Pi's monotonic clock
; (the Pi's own clock error cancels in the ratio between two devices), and
; each stream is resampled to output_rate with a windowed-sinc polyphase
; ASRC. Rate tracking runs even with this disabled -- see the "clock" field
; in get_config/status for each device's measured ppm offset.
;
; Note the MCC 172 can only sample at 51200/n, so 48000 is not reachable in
; hardware; it is produced here in software. Everything downstream (ring
; buffers, levels, bands, metrics, get_raw) then runs at output_rate.
;
; Cost: about 20% of one Pi 4 core for 6 channels. Accuracy at the default
; 32 taps / 4096 phases, 51.2 kHz -> 48 kHz: -100 dB at 1 kHz, -88 dB at
; 10 kHz, i.e. below the MCC 172's own -93 dB THD.
enabled = false

; Common output rate. 48000 is the usual choice (standard audio rate, and
; both devices can be resampled to it cleanly).
output_rate = 48000

; Sinc kernel length and fractional-phase resolution. The defaults are
; already well below the hardware's noise floor; raise taps for a flatter
; response near Nyquist, phases for better high-frequency accuracy.
taps = 32
phases = 4096

[trigger]
; Synchronized start: arm every device on a shared RISING edge so both
; scans begin on the same pulse. Wiring (common ground required):
;
;   GPIO <gpio_pin> --+-- MCC 172 "TRIG" screw terminal (J5 pin 1)
;                     +-- DT9837A "Ext Trigger" input
;   GND -----------------+-- MCC 172 "GND" (J5 pin 2) / DT9837A ground
;
; Rising edge only -- the DT9837A external digital trigger supports no
; other edge. 3.3 V GPIO levels satisfy both trigger inputs.
;
; NOTE: this aligns the START of the scans (about +-1 sample per device,
; plus each ADC's fixed group delay). The two devices' ADC clocks still
; drift relative to each other (~ppm), so long cross-device phase analysis
; still needs same-device channels or software resync.
sync_start = false

; 'gpio'     -> the Pi itself pulses gpio_pin when "start" is issued.
; 'external' -> the scans arm and wait for an edge you supply on the
;               trigger inputs (the Pi does not pulse anything).
source = gpio

; BCM pin for the trigger pulse. Must not collide with pins used by the
; MCC 172 HAT (0,1,5,6,8-13,16,19,20,26). 17, 27, and 22 are safe choices.
gpio_pin = 17

; High-time of the trigger pulse in milliseconds.
pulse_ms = 10

[weighting]
; Frequency weighting applied on the Pi before the level is computed:
;   A -> A-weighting (IEC 61672, most common for environmental noise)
;   C -> C-weighting (peaks, low-frequency content)
;   Z -> none / flat (Z = zero weighting)
frequency = A

; Time weighting for the streamed level and for Lmax/Lmin/LN metrics:
;   Fast (125 ms) or Slow (1 s) -- IEC 61672 symmetric one-pole averages.
;   Impulse (35 ms rise / 1.5 s decay, asymmetric) -- the older IEC
;     60651/60804 definition; IEC 61672-1 (current) does not define it.
;     Only use this if a specific local regulation calls for it.
time = Fast

[level]
; Stream the (frequency + time weighted) broadband level as LEVEL frames.
; This is the light, always-on "sound level meter needle" output.
enabled = true

; How many level values per second to send, per channel (e.g. 10 = every
; 100 ms). The level itself is computed at the full sample rate; this only
; sets the reporting/downsample rate.
output_rate = 10

[storage]
; Seconds of raw samples kept in RAM ring buffers (one per device). This is
; the only raw storage -- nothing is written to the SD card. The buffer
; serves get_metrics (Leq/Lmax/Lmin/Lpeak/LN over a window) and get_raw
; (dump the window to the laptop as RAW_DUMP frames).
;
; RAM cost is 8 bytes/sample (packed):
;   2 ch x 51.2 kHz : 0.82 MB/s -> 300 s = ~246 MB
;   6 ch x 51.2 kHz : 2.46 MB/s -> 300 s = ~740 MB (Pi 4 4GB fine, 2GB tight)
buffer_seconds = 300

[ups]
; Read-only from pislm's side: battery status (voltage/current/percent) for
; an optional INA219-based UPS HAT (e.g. Waveshare UPS HAT), surfaced in
; the 'ups' field of the handshake/get_config. pislm never touches the I2C
; bus itself -- the separate pislm-shutdown-button service (see INSTALL.md
; §14, shutdown_button.py) owns the actual polling and low-battery
; auto-shutdown; this just points at the status file it writes.
status_file = /run/pislm-ups-status.json
; How old (seconds) a reading can be before it's flagged stale=true --
; e.g. if pislm-shutdown-button isn't running.
stale_after_seconds = 60

[bands]
; Optional fractional-octave (1/3-octave by default) spectrum. Each band is a
; real-time Butterworth band-pass filter, DECIMATED to just above twice its
; upper edge. Requires numpy + scipy on the Pi
; (sudo apt install python3-numpy python3-scipy).
enabled = false

; What to send per band on the stream port:
;   level    -> Fast time-weighted band level in dB (BAND_LEVEL frames), with
;               the A/C weighting offset applied per band center. The natural
;               sound-level-meter spectrum; very light on bandwidth.
;   waveform -> the decimated band time signal (BAND frames). Much heavier;
;               see the bandwidth note below.
output = level

; Band-center frequency range (Hz) and octave fraction (3 = 1/3-octave).
f_min = 20
f_max = 20000
fraction = 3

; Butterworth order passed to scipy.signal.butter. A band-pass design yields
; a 2*order system, so order = 3 (the default) is a 6th-order band-pass (3
; biquads). This is a real tradeoff, not a free lunch:
;   - Ringing on impulsive/transient sounds: order = 3 rings ~124 ms on the
;     worst-case (lowest-frequency) 1/3-octave band; order = 6 (the old
;     default, 12th-order) rings ~208 ms there -- roughly double.
;   - Adjacent-band rejection: order = 3 only rejects a pure tone in the
;     NEXT 1/3-octave band by ~18 dB; order = 6 rejects it by ~35 dB. A
;     sound with concentrated/tonal energy (many real impacts have a
;     resonant peak) will visibly leak into neighboring bands at order = 3,
;     making them read higher than expected -- this is not a bug, it is
;     this filter's actual selectivity at low order.
; If accurate per-band spectral separation matters more than minimizing
; ringing for your use case (e.g. ISO 3382 / floor impact analysis), raise
; this to 4-6. There is no order that minimizes both simultaneously.
order = 3

; Keep each band's decimated rate >= 2 * upper_edge * margin (>= 1.0).
; Only relevant for output = waveform.
;
; BANDWIDTH (output = waveform only): high 1/3-octave bands are wide, so they
; barely decimate. The full 20 Hz - 20 kHz set at 51.2 kHz is ~5x the raw
; stream for 2 channels (~36 Mbit/s), marginal on Wi-Fi. Lower f_max to fit.
; output = level is tiny regardless of range.
decimation_margin = 1.0
