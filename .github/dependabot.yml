version: 2
updates:
  - package-ecosystem: "pip"
    directories:
      - "/"
      - "/examples/python/**"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    ignore:
      # numpy 2.5+ requires Python 3.12; stay on 2.4.x while supporting
      # Raspberry Pi OS bookworm (Python 3.11).
      - dependency-name: "numpy"
        versions: [">=2.5"]

  # GitHub Actions used in .github/workflows (CodeQL)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
