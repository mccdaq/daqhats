name: "CI"

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: Build and test
    # 64-bit ARM, the same architecture as 64-bit Raspberry Pi OS.
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Oldest Python supported on current Raspberry Pi OS (bookworm), so
      # dependency updates that drop it fail here before merging.
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgpiod-dev libgtk-3-dev pkg-config

      - name: Build library, tools, and C examples
        run: |
          make -C lib all
          sudo make -C lib install
          sudo make -C include install
          make -C tools all
          make -C examples/c all

      - name: Install Python library and example requirements
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install .
          find examples/python -name requirements.txt -print0 |
            xargs -0 -n1 "$RUNNER_TEMP/venv/bin/pip" install -r

      - name: Test
        run: |
          "$RUNNER_TEMP/venv/bin/python" -m compileall -q daqhats examples/python
          "$RUNNER_TEMP/venv/bin/python" -c "import daqhats; print(daqhats.hat_list())"
